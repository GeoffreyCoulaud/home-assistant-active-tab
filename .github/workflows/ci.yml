name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write # needed to create GitHub Releases on tags

jobs:
  checks:
    name: Type-check, lint, test, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run format:check

  package:
    name: Package and release
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      # Which store publishers have their secrets configured (gates the
      # publish jobs, since job-level `if` can't read secrets directly).
      firefox: ${{ steps.detect.outputs.firefox }}
      chrome: ${{ steps.detect.outputs.chrome }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify tag matches manifest version
        run: |
          manifest_version="$(node -p "require('./extension/manifest.json').version")"
          tag_version="${TAG#v}"
          echo "manifest=$manifest_version tag=$tag_version"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Tag $TAG does not match manifest version $manifest_version. Bump extension/manifest.json before tagging."
            exit 1
          fi

      - name: Package extension zip
        run: |
          ( cd extension && zip -r -FS ../extension.zip . )
          ls -l extension.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" extension.zip --title "$TAG" --generate-notes

      - name: Detect configured publishers
        id: detect
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          echo "firefox=$([ -n "$AMO_JWT_ISSUER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "chrome=$([ -n "$CHROME_EXTENSION_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: |
            extension.zip
            amo-metadata.json
          retention-days: 7

  publish-firefox:
    name: Publish to Firefox Add-ons (AMO, listed)
    needs: package
    if: needs.package.outputs.firefox == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: extension-package
      - name: Unzip packaged source
        run: mkdir pkg && unzip -q extension.zip -d pkg
      - name: Sign and submit (listed)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # Listed versions are signed only after Mozilla's manual review, so
        # don't wait for approval (default is 15 min) — submit and exit.
        run: >
          npx --yes web-ext sign
          --source-dir=pkg
          --channel=listed
          --amo-metadata=amo-metadata.json
          --approval-timeout=0
          --api-key="$WEB_EXT_API_KEY"
          --api-secret="$WEB_EXT_API_SECRET"

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: package
    if: needs.package.outputs.chrome == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: extension-package
      - name: Upload and publish
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: >
          npx --yes chrome-webstore-upload-cli@3 upload
          --source extension.zip
          --extension-id "$CHROME_EXTENSION_ID"
          --client-id "$CHROME_CLIENT_ID"
          --client-secret "$CHROME_CLIENT_SECRET"
          --refresh-token "$CHROME_REFRESH_TOKEN"
          --auto-publish
